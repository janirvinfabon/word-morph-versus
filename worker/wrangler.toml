name = "word-morph-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# One Durable Object instance per game room, addressed by room code.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDurableObject"

# Single global registry of rooms waiting for a second player.
[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "LobbyRegistry"

# SQLite-backed DO is REQUIRED for the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LobbyRegistry"]

[observability]
enabled = true
